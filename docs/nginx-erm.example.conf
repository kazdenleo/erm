# Пример nginx для ERM (Ubuntu).
# Скопируйте в /etc/nginx/sites-available/erm и сделайте symlink в sites-enabled.
# Замените server_name на ваш домен.

server {
    listen 80;
    # listen 443 ssl;  # если есть сертификат — настройте ssl отдельно
    server_name example.com www.example.com;

    client_max_body_size 20m;

    # API → Node (порт как в server/.env PORT, обычно 3001)
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Загрузки картинок товаров
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001/uploads/;
        proxy_set_header Host $host;
    }

    # Сайт (React): либо статика из client/build, либо прокси на Node (если SPA отдаёт Node)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }
}

