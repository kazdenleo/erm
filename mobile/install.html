<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Установка ERM Склад</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f3f5f9;
      color: #1b2430;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      width: min(420px, 100%);
      background: #fff;
      border: 1px solid #dde2ea;
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(27, 36, 48, 0.06);
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 20px; color: #6b7686; line-height: 1.45; }
    img {
      width: min(280px, 100%);
      height: auto;
      border-radius: 8px;
      background: #fff;
    }
    a.btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 20px;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
    .hint { margin-top: 14px; font-size: 13px; color: #6b7686; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ERM Склад</h1>
    <p>Отсканируйте QR камерой телефона или скачайте APK напрямую.</p>
    <img src="/erm-warehouse-apk-qr.png" alt="QR код установки ERM Склад" />
    <div>
      <a class="btn" href="/erm-warehouse.apk">Скачать APK</a>
    </div>
    <p class="hint">Если установка блокируется — удалите старую версию приложения и разрешите установку из браузера.</p>
  </div>
</body>
</html>
