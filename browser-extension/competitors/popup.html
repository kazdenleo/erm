<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 320px; margin: 0; font: 13px/1.4 sans-serif; color: #111; }
    .box { padding: 12px; }
    label { display: block; margin: 8px 0 4px; color: #444; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; }
    button { margin-top: 8px; padding: 6px 10px; cursor: pointer; }
    .row { display: flex; gap: 8px; }
    .row button { flex: 1; }
    .muted { color: #666; font-size: 12px; }
    .err { color: #b91c1c; font-size: 12px; }
    .ok { color: #166534; font-size: 12px; }
    ul { list-style: none; margin: 6px 0 0; padding: 0; max-height: 160px; overflow: auto; }
    li { padding: 6px; border: 1px solid #e5e5e5; border-radius: 6px; margin-bottom: 4px; cursor: pointer; }
    li.active { border-color: #166534; background: #f0fdf4; }
    h1 { font-size: 14px; margin: 0 0 8px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Конкуренты ЕРМ</h1>
    <div id="session" class="muted">Нужно войти</div>
    <label for="api">Адрес API</label>
    <input id="api" value="http://localhost:3001/api" />
    <label for="login">Логин</label>
    <input id="login" autocomplete="username" />
    <label for="password">Пароль</label>
    <input id="password" type="password" autocomplete="current-password" />
    <button id="loginBtn" type="button">Войти</button>
    <label for="q">Наш товар</label>
    <input id="q" placeholder="Артикул или название" />
    <ul id="results"></ul>
    <div id="picked" class="ok"></div>
    <label><input id="auto" type="checkbox" checked /> Записывать цену при открытии карточки</label>
    <div class="row">
      <button id="capture" type="button">Записать открытую вкладку</button>
    </div>
    <div id="status" class="muted"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
